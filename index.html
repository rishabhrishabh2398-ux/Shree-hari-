<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow Dashboard</title>
<script>try{var t=localStorage.getItem("flow-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
:root{
  color-scheme: light;
  --page:#f4f4f1; --surface:#ffffff; --sunk:#f0efeb; --ink:#141413; --ink2:#4a4945; --muted:#6c6a64;
  --line:#e3e2dc; --grid:#ecebe6; --axis:#c6c5bc; --ring:rgba(20,20,19,.10);
  --accent:#1d62c4; --accent-ink:#ffffff; --accent-soft:#e8f0fb; --s1:#2a78d6; --s1-soft:rgba(42,120,214,.10);
  --up:#0b7a0b; --down:#c43535;
  --good:#0ca30c; --warn:#e7a50f; --serious:#ec835a; --crit:#d03b3b;
  --good-bg:#e7f4e7; --warn-bg:#fdf3d8; --serious-bg:#fdebe3; --crit-bg:#fbe6e6; --info-bg:#e8f0fb; --none-bg:#efeeea;
  --hl:#fff8e3; --focus:#1d62c4; --wa-bg:#e2f5d6;
  --shadow:0 1px 2px rgba(20,20,19,.04),0 2px 8px rgba(20,20,19,.04);
  --shadow-lg:0 16px 48px rgba(0,0,0,.20);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#0e0e0d; --surface:#1a1a19; --sunk:#242422; --ink:#f0efec; --ink2:#c9c8c0; --muted:#9a9890;
    --line:#2e2e2b; --grid:#272725; --axis:#43433f; --ring:rgba(255,255,255,.09);
    --accent:#6aa5f2; --accent-ink:#08152a; --accent-soft:#1a2738; --s1:#3987e5; --s1-soft:rgba(57,135,229,.16);
    --up:#3cc23c; --down:#f06a6a;
    --good:#22b822; --warn:#f2b632; --serious:#f08f66; --crit:#ec5c5c;
    --good-bg:#16291a; --warn-bg:#2d2512; --serious-bg:#2f1e16; --crit-bg:#321819; --info-bg:#172334; --none-bg:#262624;
    --hl:#2a2412; --focus:#6aa5f2; --wa-bg:#1b2e1f;
    --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 16px 48px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0e0e0d; --surface:#1a1a19; --sunk:#242422; --ink:#f0efec; --ink2:#c9c8c0; --muted:#9a9890;
  --line:#2e2e2b; --grid:#272725; --axis:#43433f; --ring:rgba(255,255,255,.09);
  --accent:#6aa5f2; --accent-ink:#08152a; --accent-soft:#1a2738; --s1:#3987e5; --s1-soft:rgba(57,135,229,.16);
  --up:#3cc23c; --down:#f06a6a;
  --good:#22b822; --warn:#f2b632; --serious:#f08f66; --crit:#ec5c5c;
  --good-bg:#16291a; --warn-bg:#2d2512; --serious-bg:#2f1e16; --crit-bg:#321819; --info-bg:#172334; --none-bg:#262624;
  --hl:#2a2412; --focus:#6aa5f2; --wa-bg:#1b2e1f;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 16px 48px rgba(0,0,0,.65);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html:has(dialog[open]){overflow:hidden}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;margin:-1px;padding:0;border:0}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.n,.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.hidden{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:14px 12px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 10px}
.logo .mk{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--page);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.logo b{font-size:16px;display:block;line-height:1.2}
.logo span{font-size:12px;color:var(--muted)}
.navg{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:14px 10px 4px;font-weight:600}
.ni{display:flex;align-items:center;gap:11px;width:100%;min-height:40px;padding:8px 10px;border:0;background:none;border-radius:10px;color:var(--ink2);text-align:left;font-weight:500;font-size:14px}
.ni:hover{background:var(--sunk);color:var(--ink)}
.ni[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.ni[aria-current="page"] .i{color:var(--accent)}
.bdg{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--ink);color:var(--page);font-size:11px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.bdg.crit{background:var(--crit);color:#fff}
.bdg.dot{min-width:9px;width:9px;height:9px;padding:0}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:14px 4px 4px;border-top:1px solid var(--line)}
.sidefoot .seg button{padding:0 6px}
.sidefoot .seg button .i{display:none}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin-top:6px}
.dotlive{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 28px;background:var(--page);background:color-mix(in srgb,var(--page) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.ttl{min-width:0;flex:1}
.ttl h1{margin:0;font-size:21px;line-height:1.25;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
.ttl .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbtn{display:flex;align-items:center;gap:8px;width:300px;height:40px;padding:0 8px 0 12px;border:1px solid var(--line);background:var(--surface);border-radius:11px;color:var(--muted);font-size:14px;text-align:left}
.searchbtn:hover{border-color:var(--axis)}
.searchbtn .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:11px/1 ui-monospace,SFMono-Regular,Consolas,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 5px;color:var(--muted);background:var(--sunk)}
.samplepill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px dashed var(--axis);border-radius:999px;background:transparent;color:var(--ink2);font-size:12px;font-weight:600;white-space:nowrap}
.samplepill:hover{background:var(--sunk)}
.samplepill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn)}
.rolechip{display:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;place-items:center;flex:none}
.content{padding:22px 28px 56px;width:100%;max-width:1480px;margin:0 auto}
.bnav{display:none}
.fab{display:none}

@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));gap:8px}
  .ttl h1{font-size:19px}
  .content{padding:14px 16px calc(150px + env(safe-area-inset-bottom))}
  .searchbtn{width:40px;padding:0;justify-content:center;flex:none}
  .searchbtn .lbl,.searchbtn kbd{display:none}
  .desk-only{display:none!important}
  .rolechip{display:grid}
  .bnav{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:30;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .bnav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px;padding:4px 2px}
  .bnav button span:not(.bdg):not(.sr){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bnav button[aria-current="page"]{color:var(--accent)}
  .bnav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
  .bnav .bdg{position:absolute;top:3px;left:calc(50% + 5px);margin:0;height:18px;min-width:18px;font-size:10px}
  .bnav .bdg.dot{height:9px;min-width:9px;top:8px;left:calc(50% + 8px)}
  .fab{display:inline-flex;position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:29;align-items:center;gap:8px;height:52px;padding:0 20px 0 16px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.22);transition:transform .2s}
  body.toasting .fab{transform:translateY(-64px)}
}
@media (max-width:420px){ .samplepill{padding:0 8px} .samplepill .long{display:none} }

/* ---------- layout ---------- */
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.grid>*{grid-column:span 12;min-width:0}
.grid>.c3{grid-column:span 3}.grid>.c4{grid-column:span 4}.grid>.c5{grid-column:span 5}.grid>.c6{grid-column:span 6}.grid>.c7{grid-column:span 7}.grid>.c8{grid-column:span 8}
@media (max-width:1180px){.grid>.c3{grid-column:span 6}.grid>.c4,.grid>.c5,.grid>.c7,.grid>.c8{grid-column:span 12}}
@media (max-width:899px){.grid>.c6{grid-column:span 12}.grid{gap:12px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
@media (max-width:899px){.card{padding:14px}}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin:0 0 12px}
.ch h2,.ch h3{font-size:15px;margin:0;font-weight:650;letter-spacing:-.005em}
.ch h2 small,.ch h3 small{font-weight:400;color:var(--muted);font-size:13px}
.sec-h{font-size:15px;font-weight:650;margin:6px 2px 10px}
.sec-h small{font-weight:400;color:var(--muted);font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;max-width:720px}
.qa .btn{white-space:normal;text-align:center}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 13px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:14px;font-weight:550;white-space:nowrap;color:var(--ink);text-decoration:none;transition:background .12s,border-color .12s}
.btn:hover{background:var(--sunk);border-color:var(--axis)}
.btn .i{width:18px;height:18px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--crit)}
.btn.dng-fill{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.icon{width:40px;min-width:40px;padding:0}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.icon.sm{width:34px;min-width:34px}
.btn.lg{min-height:46px;padding:0 18px;font-size:15px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
@media (max-width:899px),(pointer:coarse){.btn,.btn.sm{min-height:40px}.btn.icon.sm{width:40px;min-width:40px}}
.lnk{border:0;background:none;padding:0;color:var(--ink);font-weight:650;text-align:left;text-decoration:underline;text-decoration-color:var(--axis);text-underline-offset:3px;cursor:pointer;font-size:inherit}
.lnk:hover{text-decoration-color:currentColor}
.lnk.sm{font-size:13px;font-weight:500;color:var(--ink2)}
.inp{width:100%;min-height:40px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0}
.inp:hover{border-color:var(--axis)}
.inp:focus-visible{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
textarea.inp{resize:vertical;line-height:1.45}
.fld{display:block;font-size:13px;color:var(--ink2);font-weight:550;margin:14px 0 6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.field{position:relative;flex:1 1 240px;min-width:0;display:block}
.field>.i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px;pointer-events:none}
.field .inp{padding-left:36px}
.bar select.inp{width:auto;flex:0 1 200px}
.seg{display:inline-flex;padding:3px;background:var(--sunk);border-radius:11px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;min-height:34px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:550;color:var(--ink2);white-space:nowrap}
.seg button .i{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg button .c{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.seg.full{display:flex;width:100%}.seg.full button{flex:1;justify-content:center}
@media (max-width:899px){.seg button{min-height:40px}}
.chipt{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:550;color:var(--ink2)}
.chipt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chipt .i{width:16px;height:16px}
@media (max-width:899px){.chipt{min-height:40px}}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty .inp{width:72px;text-align:center;padding:8px 4px;-moz-appearance:textfield}
.qty .inp::-webkit-inner-spin-button,.qty .inp::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.qty .btn{font-size:18px;font-weight:500}
.err{color:var(--crit);font-size:13px;font-weight:550;margin-top:10px}
.err:empty{display:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.db>.row2:first-child .fld{margin-top:0}
@media (max-width:560px){.row2{grid-template-columns:1fr}.db>.row2:first-child>div+div .fld{margin-top:14px}}

/* ---------- status ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 8px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.5;background:var(--none-bg);color:var(--ink);white-space:nowrap;vertical-align:middle}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--axis));flex:none}
.pill.good{--c:var(--good);background:var(--good-bg)}
.pill.warn{--c:var(--warn);background:var(--warn-bg)}
.pill.serious{--c:var(--serious);background:var(--serious-bg)}
.pill.crit{--c:var(--crit);background:var(--crit-bg)}
.pill.info{--c:var(--s1);background:var(--info-bg)}
.pill.none{--c:var(--axis)}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--axis));flex:none}
.sdot.good{--c:var(--good)}.sdot.warn{--c:var(--warn)}.sdot.serious{--c:var(--serious)}.sdot.crit{--c:var(--crit)}.sdot.info{--c:var(--s1)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:6px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.sev{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.sev .i{width:17px;height:17px}
.sev.crit{background:var(--crit-bg);color:var(--crit)}
.sev.serious{background:var(--serious-bg);color:var(--serious)}
.sev.warn{background:var(--warn-bg);color:var(--warn)}
.sev.info{background:var(--info-bg);color:var(--s1)}

/* ---------- KPI ---------- */
.kpi{display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit}
button.kpi{cursor:pointer;transition:border-color .12s}
button.kpi:hover{border-color:var(--axis)}
button.kpi[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kpi .lb{font-size:13px;color:var(--ink2);font-weight:550;display:flex;align-items:center;justify-content:space-between;gap:6px}
.kpi .lb .i{width:16px;height:16px;color:var(--muted)}
.kpi .v{font-size:28px;font-weight:720;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:6px}
.kpi .d{font-size:13px;color:var(--ink2);margin-top:4px}
@media (max-width:560px){.kpi .v{font-size:22px}.kpi .d{font-size:12px}}
.meter{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--s1);border-radius:3px}
.meter.over i{background:var(--crit)}
.prog{display:flex;height:6px;background:var(--grid);border-radius:3px;overflow:hidden;min-width:90px}
.prog i{display:block;height:100%}
.prog .p-inv{background:var(--s1)}
.prog .p-disp{background:var(--s1);opacity:.42}

/* ---------- lists ---------- */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--grid)}
.li:last-child{border-bottom:0;padding-bottom:0}
.li:first-child{padding-top:0}
.li-b{flex:1;min-width:0;font-size:14px}
.li-b .small,.li-b .xs{display:block}
.qi{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--grid)}
.qi:last-child{border-bottom:0}
.qi .qm{min-width:0;flex:1 1 160px}
.om{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin:0 0 8px;border:1px solid var(--line);border-radius:11px;background:var(--surface);text-align:left;min-height:44px}
.om:hover{border-color:var(--axis);background:var(--sunk)}
.rq{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--grid)}
.rq:last-child{border-bottom:0}
.rq>div:first-child{flex:1 1 220px;min-width:0}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 12px;color:var(--ink2);font-size:14px}
.empty .i{width:30px;height:30px;color:var(--muted);stroke-width:1.5}
.empty b{color:var(--ink);font-size:15px}
.ln{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:1px 0}
.ln-q{font-variant-numeric:tabular-nums;color:var(--ink2)}
.ln-q b{color:var(--ink)}

/* ---------- responsive table ---------- */
.tw{overflow-x:auto;position:relative}
.card,.dc,.rt tr{position:relative}
table.rt,table.mx{width:100%;border-collapse:collapse;font-size:14px}
.rt th,.mx th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.rt td,.mx td{padding:11px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
.rt tbody tr:last-child td{border-bottom:0}
.rt .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rt tbody tr[data-go]{cursor:pointer}
.rt tbody tr[data-go]:hover td{background:var(--sunk)}
.rt tr.hl td{background:var(--hl)}
.rt td.act{text-align:right}
.rt td.act .btns{justify-content:flex-end;flex-wrap:nowrap}

// ===================== CALCULATIONS =====================
function orderCalc(o){
  const ch = S.challans.filter(c => c.order === o.id);
  const sum = (item, pred) => ch.filter(pred).reduce((a,c) => a + (c.lines.find(l => l.item === item)?.qty || 0), 0);
  const lines = o.lines.map(l => ({ ...l,
    chal: sum(l.item, () => true),
    disp: sum(l.item, c => c.status !== "Draft"),
    inv:  sum(l.item, c => c.status === "Invoiced") }));
  lines.forEach(l => l.left = Math.max(0, l.qty - l.chal));
  const T = k => lines.reduce((a,l) => a + l[k], 0);
  let status;
  if (o.cancelled) status = "Cancelled";
  else if (o.hold && S.reqs.find(r => r.id === o.hold)?.status === "Pending") status = "On hold";
  else if (T("inv") >= T("qty")) status = "Completed";
  else if (T("disp") > 0 && T("disp") >= T("qty")) status = "Awaiting invoice";
  else if (T("chal") > 0) status = "Partly done";
  else status = "New";
  return { lines, status, open: !["Completed","Cancelled"].includes(status) };
}
function stockCalc(){
  const m = {};
  S.items.forEach(i => m[i.name] = { out: 0, reserved: 0, onPO: 0, waiting: [] });
  S.challans.filter(c => c.status === "Dispatched").forEach(c => c.lines.forEach(l => m[l.item].out += l.qty));
  S.orders.forEach(o => { const c = orderCalc(o); if (!c.open) return;
    c.lines.forEach(l => { if (l.left > 0){ m[l.item].reserved += l.left; m[l.item].waiting.push(o.id); } }); });
  S.pos.filter(p => p.status !== "Received").forEach(p => p.lines.forEach(l => m[l.item].onPO += Math.max(0, l.qty - l.rec)));
  S.items.forEach(i => { const x = m[i.name]; x.available = i.qty - x.out; x.free = x.available - x.reserved; x.short = Math.max(0, -x.free); });
  return m;
}

// ===================== SAMPLE SALES (as from Tally invoices) =====================
let seed;
const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
function salesSample(){
  seed = 11; const now = new Date(), trend = [];
  for (let i = 29; i >= 0; i--){ const d = new Date(now); d.setDate(d.getDate() - i);
    trend.push({ date: d.toISOString().slice(0,10), sales: Math.round((260000 + rnd()*240000) * (d.getDay() === 0 ? .3 : 1)) }); }
  trend[29].sales = Math.round(trend[29].sales * .55);
  const month = trend.slice(-now.getDate()).reduce((a,b) => a + b.sales, 0);
  const boost = [1.9,1.4,.8,.45,.35,.3,.35,.45,.7,1.3,1.8,2.1];
  const share = [.30,.22,.14*boost[now.getMonth()],.18,.08], tot = share.reduce((a,b)=>a+b,0);
  const season = [];
  for (let i = 11; i >= 0; i--){ const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    season.push({ label: d.toLocaleString("en-IN",{month:"short"}), units: Math.round((60 + rnd()*30) * boost[d.getMonth()]) }); }
  return { trend, month, target: 13000000, invoices: 21, brands: BRANDS.map((b,i) => ({ name:b, sales: month*share[i]/tot })), season };
}
const SALES = salesSample();

const T_MON = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function tDate(s){ s = (s || "").trim(); if (/^\d{8}$/.test(s)) return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;
  const m = s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/); if (m){ let y = +m[3]; if (y < 100) y += 2000;
    return new Date(Date.UTC(y, T_MON[m[2].toLowerCase()], +m[1])).toISOString().slice(0,10); } return s; }
const tNameOf = n => n.getAttribute("NAME") || tField(n, "NAME");
function tParseXml(text){
  const start = text.indexOf("<"); text = text.slice(start < 0 ? 0 : start).replace(/&#(?:[0-8]|1[124-9]|2\d|3[01]);/g, "").replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "");
  const doc = new DOMParser().parseFromString(text, "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("Not a Tally export file.");
  return doc;
}
function tAbsorb(doc, data){
  const got = [];
  const ledgers = [...doc.getElementsByTagName("LEDGER")];
  if (ledgers.length){ data.parties = ledgers.map(l => { const bal = tNum(tField(l,"CLOSINGBALANCE"));
      return { name: tNameOf(l), group: tField(l,"PARENT"), due: -bal, gstin: tField(l,"PARTYGSTIN") || tField(l,"LEDGSTREGDETAILS.LIST/GSTIN"),
        phone: tField(l,"LEDGERMOBILE") || tField(l,"LEDGERPHONE"), state: tField(l,"LEDSTATENAME"), creditLimit: Math.abs(tNum(tField(l,"CREDITLIMIT"))) }; });
    got.push(`${ledgers.length} parties`); }
  const items = [...doc.getElementsByTagName("STOCKITEM")];
  if (items.length){ data.items = items.map(s => { const cb = tField(s,"CLOSINGBALANCE");
      return { name: tNameOf(s), group: tField(s,"PARENT"), unit: tField(s,"BASEUNITS") || tUnit(cb), qty: tNum(cb), rate: tNum(tField(s,"CLOSINGRATE")), value: Math.abs(tNum(tField(s,"CLOSINGVALUE"))), reorder: tNum(tField(s,"REORDERBASE")) }; });
    got.push(`${items.length} stock items`); }
  const bf = doc.getElementsByTagName("BILLFIXED");
  if (bf.length){ const bills = []; let cur = null;
    for (const n of bf[0].parentNode.children){
      if (n.tagName === "BILLFIXED"){ if (cur) bills.push(cur); cur = { party: tField(n,"BILLPARTY"), ref: tField(n,"BILLREF"), date: tDate(tField(n,"BILLDATE")), amount: 0, overdue: 0 }; }
      else if (cur && n.tagName === "BILLCL") cur.amount = Math.abs(tNum(n.textContent));
      else if (cur && n.tagName === "BILLOVERDUE") cur.overdue = tNum(n.textContent);
    }
    if (cur) bills.push(cur); data.bills = bills; got.push(`${bills.length} bills`); }
  const vs = [...doc.getElementsByTagName("VOUCHER")];
  if (vs.length){ const map = new Map((data.vouchers || []).map(v => [v.guid || v.type + v.number + v.date, v]));
    vs.forEach(v => { let inv = [...v.children].filter(c => c.tagName === "ALLINVENTORYENTRIES.LIST"); if (!inv.length) inv = [...v.children].filter(c => c.tagName === "INVENTORYENTRIES.LIST");
      const its = inv.map(e => { const q = tField(e,"ACTUALQTY") || tField(e,"BILLEDQTY"); return { item: tField(e,"STOCKITEMNAME"), qty: Math.abs(tNum(q)), amount: Math.abs(tNum(tField(e,"AMOUNT"))), orderNo: tField(e,"BATCHALLOCATIONS.LIST/ORDERNO") }; });
      let amt = Math.abs(tNum(tField(v,"AMOUNT"))); if (!amt) amt = its.reduce((a,i) => a + i.amount, 0);
      const rec = { guid: tField(v,"GUID"), date: tDate(tField(v,"DATE")), type: tField(v,"VOUCHERTYPENAME") || v.getAttribute("VCHTYPE") || "", number: tField(v,"VOUCHERNUMBER"), party: tField(v,"PARTYLEDGERNAME"), amount: amt,
        cancelled: tField(v,"ISCANCELLED") === "Yes", optional: tField(v,"ISOPTIONAL") === "Yes", items: its };
      map.set(rec.guid || rec.type + rec.number + rec.date, rec); });
    data.vouchers = [...map.values()].sort((a,b) => a.date.localeCompare(b.date)); got.push(`${vs.length} vouchers`); }
  return got;
}
async function tdLoadFiles(fileList){
  if (!TD || TD.snapshot) TD = {}; // a published snapshot is replaced, not merged into, by a real load
  const msgs = [];
  for (const f of fileList){ try { const got = tAbsorb(tParseXml(await f.text()), TD); msgs.push(`${f.name}: ${got.join(", ") || "nothing recognised"}`); } catch(err){ msgs.push(`${f.name}: ${err.message}`); } }
  TD.loadedAt = new Date().toISOString(); tdSave();
  toast(msgs.join(" · ").slice(0, 160), { icon: "tally" }); renderView();
}
function tdClear(){ TD = null; try { localStorage.removeItem(TALLY_KEY); } catch(e){} renderView(); }

function lineChart(el, rows){
  const W = Math.max(280, Math.round(el.clientWidth || 720)), H = W < 520 ? 200 : 240, L = 58, R = 10, T = 12, B = 26, n = rows.length - 1;
  const max = Math.max(...rows.map(r => r.sales)) * 1.08;
  const x = i => L + i * (W - L - R) / n, y = v => T + (1 - v / max) * (H - T - B);
  let g = "";
  for (let k = 0; k <= 4; k++){ const v = max/1.08*k/4, yy = y(v).toFixed(1);
    g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${k?"var(--grid)":"var(--axis)"}" stroke-width="1"/><text x="${L-8}" y="${+yy+4}" font-size="11" fill="var(--muted)" text-anchor="end">${inr(v)}</text>`; }
  g += [0,7,14,21,n].map(i => `<text x="${x(i)}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="${i===0?"start":i===n?"end":"middle"}">${fmtD(rows[i].date)}</text>`).join("");
  const pts = rows.map((r,i) => `${x(i).toFixed(1)},${y(r.sales).toFixed(1)}`);
  const area = `M${x(0)},${H-B} L${pts.join(" L")} L${x(n)},${H-B} Z`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Daily sales, last 30 days. Today so far ${inr(rows[n].sales)}.">${g}
    <path d="${area}" fill="var(--s1)" opacity=".07"/>
    <polyline points="${pts.slice(0, n).join(" ")}" fill="none" stroke="var(--s1)" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="${pts[n-1]} ${pts[n]}" fill="none" stroke="var(--s1)" stroke-width="1.75" stroke-dasharray="4 3"/>
    <line class="xh" y1="${T}" y2="${H-B}" stroke="var(--axis)" opacity="0"/><circle class="xd" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
    <circle cx="${x(n)}" cy="${y(rows[n].sales)}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
    <rect class="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/></svg>`;
  const svg = el.querySelector("svg"), xh = el.querySelector(".xh"), xd = el.querySelector(".xd"), hit = el.querySelector(".hit");
  const move = e => { const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(n, Math.round(((e.clientX - r.left) * W / r.width - L) / (W - L - R) * n)));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("opacity", 1);
    xd.setAttribute("cx", x(i)); xd.setAttribute("cy", y(rows[i].sales)); xd.setAttribute("opacity", 1);
    showTip(e, `${fmtD(rows[i].date)} · <b>${inr(rows[i].sales)}</b>${i===n?" (so far)":""}`); };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { hideTip(); xh.setAttribute("opacity",0); xd.setAttribute("opacity",0); });
}
function colChart(el, rows){
  const W = Math.max(260, Math.round(el.clientWidth || 420)), H = 200, L = 32, T = 18, B = 24, max = Math.max(...rows.map(r => r.units)) * 1.12;
  const slot = (W - L) / rows.length, bw = slot * .62, y = v => T + (1 - v / max) * (H - T - B);
  let g = "";
  for (let k = 0; k <= 3; k++){ const v = max/1.12*k/3, yy = y(v).toFixed(1);
    g += `<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" stroke="${k?"var(--grid)":"var(--axis)"}"/><text x="${L-6}" y="${+yy+4}" font-size="11" fill="var(--muted)" text-anchor="end">${num(v)}</text>`; }
  const peak = rows.reduce((a,b,i) => b.units > rows[a].units ? i : a, 0);
  g += rows.map((r,i) => { const bx = L + i*slot + (slot-bw)/2, by = y(r.units), rr = Math.min(3, bw/2);
    return `<g class="cb" data-i="${i}"><rect x="${L + i*slot}" y="${T}" width="${slot}" height="${H-T-B}" fill="transparent"/>
      <path d="M${bx},${H-B} V${by+rr} Q${bx},${by} ${bx+rr},${by} H${bx+bw-rr} Q${bx+bw},${by} ${bx+bw},${by+rr} V${H-B} Z" fill="var(--s1)"/>
      <text x="${bx+bw/2}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="middle">${slot > 34 ? r.label : r.label[0]}</text>
      ${i===peak||i===rows.length-1?`<text x="${bx+bw/2}" y="${by-5}" font-size="11" fill="var(--ink2)" text-anchor="middle" font-weight="600">${r.units}</text>`:""}</g>`; }).join("");
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Racold geyser units sold per month, last 12 months">${g}</svg>`;
  el.querySelectorAll(".cb").forEach(b => { const r = rows[b.dataset.i]; const f = e => showTip(e, `${r.label} · <b>${r.units} units</b>`);
    b.addEventListener("pointermove", f); b.addEventListener("pointerdown", f); b.addEventListener("pointerleave", hideTip); });
}
function hbars(el, rows){ const max = Math.max(...rows.map(r => r.v), 1);
  el.innerHTML = rows.map(r => `<div class="hbar"><span>${r.k}</span><span class="t" role="img" aria-label="${esc(r.label || "")} ${inr(r.v)}"><i style="width:${(r.v/max*100).toFixed(1)}%"></i></span><span class="nv">${inr(r.v)}</span></div>`).join(""); }

let toastN = 0;
function toast(msg, opts = {}){
  const t = document.createElement("div"); t.className = "toast";
  t.innerHTML = `${ic(opts.icon || "check")}<span>${esc(msg)}</span>${opts.action ? `<button type="button" data-t="a">${esc(opts.action.label)}</button>` : ""}${opts.undo ? `<button type="button" data-t="u">Undo</button>` : ""}`;
  const kill = () => { t.remove(); if (!$("toasts").children.length) document.body.classList.remove("toasting"); };
  t.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
    kill(); if (b.dataset.t === "u") opts.undo(); else opts.action.fn(); });
  const box = $("toasts"); while (box.children.length > 2) box.firstChild.remove();
  box.querySelectorAll('[data-t="u"]').forEach(x => x.remove()); // only the latest change can be undone
  box.append(t); document.body.classList.add("toasting"); toastN++;
  setTimeout(kill, opts.undo ? 7000 : 4000);
}
// Every data change goes through commit(): snapshot → change → save → re-render → toast with Undo
function commit(msg, fn, opts = {}){
  const snap = JSON.stringify(S);
  const r = fn();
  save(); renderAll();
  toast(typeof msg === "function" ? msg(r) : msg, { undo: opts.noUndo ? null : () => { S = JSON.parse(snap); save(); renderAll(); toast("Undone", { icon: "undo" }); },
    action: opts.action ? { label: opts.action.label, fn: () => opts.action.fn(r) } : null });
  return r;
}

function itemOptions(sel){ return `<option value="">Choose item…</option>` + BRANDS.map(b => `<optgroup label="${b}">` +

let lineSeq = 0;
function stockHint(item){
  if (!item) return "";
  const s = stockCalc()[item], it = ITEM(item);
  return s.free > 0 ? `${pill(`${s.free} ${it.unit} free`, "good")}` : `${pill(`No free stock${s.onPO ? ` · ${s.onPO} on PO` : ""}`, s.onPO ? "serious" : "crit")}<span class="muted">can still be ordered</span>`;

function lineRow(item = "", qty = 1){ const k = ++lineSeq;
  return `<div class="pl"><select class="inp it li" id="ol-i-${k}" aria-label="Item">${itemOptions(item)}</select>${stepper(`data-lq id="ol-q-${k}"`, qty, 1, null, "Quantity")}<button type="button" class="btn icon ghost rm" data-rm aria-label="Remove this item">${ic("x")}</button><div class="hint">${stockHint(item)}</div></div>`; }
function createOrder({ party, source, lines, note }){
  const c = CUST(party);
  const o = { id: nextId("ORD"), date: today(), source, party, by: userName(), lines, note };
  if (c.due > c.limit || c.oldest > 90){
    const r = { id: nextId("REQ"), when: today(), by: userName(), what: "Credit hold", ref: o.id,
      details: `${party}: ${c.due > c.limit ? "over credit limit" : ""}${c.due > c.limit && c.oldest > 90 ? ", " : ""}${c.oldest > 90 ? `bills ${c.oldest} days old` : ""}`, status: "Pending" };
    S.reqs.unshift(r); o.hold = r.id;
  }
  S.orders.push(o); log(`Created ${o.id} for ${party} (${o.source})`);
  return o;
}

// ---------- PURCHASE ----------
function suggestions(){
  const stk = stockCalc(), by = {};
  S.items.forEach(i => { const s = stk[i.name];
    const forOrders = Math.max(0, s.reserved - Math.max(0, s.available) - s.onPO);
    const afterAll = s.available - s.reserved + s.onPO + forOrders;
    const topUp = Math.max(0, i.reorder - afterAll);
    const need = forOrders + topUp;
    if (need > 0) (by[COMPANY[i.brand]] ||= []).push({ item: i.name, unit: i.unit, forOrders, topUp, need, waiting: s.waiting, free: s.free, onPO: s.onPO });
  });
  return by;
}

function renderTdPending(V, I){
  const stock = new Map(I.map(i => [i.name, i.qty])), ord = new Map();
  V.filter(v => SO_TYPE(v.type)).forEach(v => v.items.forEach(it => { const k = (it.orderNo || v.number) + "|" + it.item;
    const o = ord.get(k) || { no: it.orderNo || v.number, date: v.date, party: v.party, item: it.item, ordered: 0, done: 0 }; o.ordered += it.qty; ord.set(k, o); }));
  V.filter(v => DONE_TYPE(v.type)).forEach(v => v.items.forEach(it => { const o = ord.get(it.orderNo + "|" + it.item); if (o) o.done += it.qty; }));
  const pend = [...ord.values()].filter(o => o.ordered - o.done > 0.001).sort((a,b) => a.date.localeCompare(b.date));
  $("td-pending").innerHTML = tbl([["Order","main"],["Party",""],["Item",""],["Pending","n"],["In stock","n"]],
    pend.slice(0, 40).map(o => { const p = o.ordered - o.done, s = stock.get(o.item);
      return { cells: [esc(o.no), esc(o.party), esc(o.item), `<b>${num(p)}</b>`, s === undefined ? "–" : s < p ? pill(num(s), "crit") : num(s)] }; }),
    empty(V.some(v => SO_TYPE(v.type)) ? "No pending orders" : "No Sales Orders in the loaded vouchers", "Load the Day Book, with Sales Orders included, to see this.", "orders"));
}

// ===================== WHATSAPP PARSER =====================
const norm = s => " " + s.toLowerCase().replace(/[^a-z0-9"\s.-]/g, " ").replace(/\s+/g, " ").trim() + " ";
const GENERIC = new Set(["store","stores","traders","trader","works","the","and","bath","hardware","homes","construction","builders","tiles","sanitary","electricals","plumbers","plumbing","studio","new"]);
function matchParty(text){
  const t = norm(text); let best = null, bs = 0;
  CUSTOMERS.forEach(c => { const toks = c.name.toLowerCase().replace(/&/g," ").split(/\s+/).filter(w => w.length > 2);
    let s = 0; toks.forEach(w => { if (t.includes(" " + w + " ") || t.includes(" " + w)) s += GENERIC.has(w) ? 0.4 : 2; });
    if (s > bs){ bs = s; best = c.name; } });
  return bs >= 2 ? best : "";
}
function matchItem(line){
  const t = norm(line); let best = null, bs = 0;
  S.items.forEach(i => { let s = 0;
    i.alias.forEach(a => { if (t.includes(a)) s += 2 + a.length / 20; });
    if (i.size && new RegExp(`(^|\\D)${i.size}\\s*(l|ltr|ltrs|litre|liter|lit)\\b`).test(t)) s += 2.5;
    else if (i.size && /(\d+)\s*(l|ltr|ltrs|litre|liter|lit)\b/.test(t)) s -= 2;
    if (s > bs){ bs = s; best = i.name; } });
  return bs >= 2 ? best : "";
}
// Confidence hint only (same scoring as matchItem): "sure" when the best match clearly beats the runner-up
function itemConfidence(line){
  const t = norm(line);
  const sc = S.items.map(i => { let s = 0;
    i.alias.forEach(a => { if (t.includes(a)) s += 2 + a.length / 20; });
    if (i.size && new RegExp(`(^|\\D)${i.size}\\s*(l|ltr|ltrs|litre|liter|lit)\\b`).test(t)) s += 2.5;
    else if (i.size && /(\d+)\s*(l|ltr|ltrs|litre|liter|lit)\b/.test(t)) s -= 2;
    return s; }).sort((a,b) => b - a);
  return sc[0] >= 2 && sc[0] - (sc[1] || 0) >= 1.5 ? "sure" : "check";
}
function parseQty(line){
  let t = line.toLowerCase().replace(/\d+(\.\d+)?\s*(l|ltr|ltrs|litre|liter|lit|kg|kgs|mm|inch|")(?![a-z])/g, " ");
  const m = t.match(/(\d+)\s*(nos|no|pcs|pc|piece|pieces|bags?|pkt|packets?|box|qty|units?)\b/) || t.match(/(?:qty|x|-|=|:)\s*(\d+)/) || t.match(/(\d+)(?!.*\d)/);
  return m ? +m[1] : 0;
}
function splitMessages(text){
  const re = /^\[?(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}),?\s+(\d{1,2}:\d{2}(?:\s?[ap]m)?)\]?\s*(?:-\s*)?([^:\n]{1,40}):\s*/gim;
  const out = []; let m, last = null;
  while ((m = re.exec(text))){ if (last) last.body = text.slice(last.end, m.index); last = { when: m[1] + " " + m[2], sender: m[3].trim(), end: re.lastIndex }; out.push(last); }
  if (last) last.body = text.slice(last.end);
  if (!out.length) return [{ when: "", sender: "", body: text }];
  return out;
}
let WA = [], waRead = false;
function readWhatsApp(text){
  WA = splitMessages(text).map(m => {
    const lines = m.body.split(/\n|,(?=\s*\D)/).map(s => s.trim()).filter(Boolean);
    const party = matchParty(m.body);
    const items = [], skipped = [];
    lines.forEach(l => { const it = matchItem(l), q = parseQty(l);
      if (it && q) items.push({ item: it, qty: q, raw: l, conf: itemConfidence(l) });
      else if (!party || !norm(l).includes(norm(party).trim().split(" ")[0])) skipped.push(l); });
    return { ...m, party, auto: party, items, skipped };
  }).filter(m => m.items.length || m.party);
  renderWA();
}

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "of-q"){ F.q = t.value; return renderOrderList(); }
  if (t.id === "sf-q"){ F.stockQ = t.value; return renderStockList(); }
  if (t.id === "pf-q"){ F.partyQ = t.value; return renderPartyList(); }
  if (t.id === "wa-text"){ F.waText = t.value; return; }
  if (t.dataset.waQty){ const [k, j] = t.dataset.waQty.split(":"); WA[k].items[j].qty = +t.value; return; }
  if (t.id === "td-pq"){ F.tdPQ = t.value; return renderTdRows(); }
  if (t.id === "td-iq"){ F.tdIQ = t.value; return renderTdRows(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("[data-role-sel]")){ role = t.value; lsSet("flow-role", role); F.flow = ""; F.short = false; renderAll(); window.scrollTo(0, 0);
    toast(`Now viewing as ${ROLES.find(r => r[0] === role)[1]}`, { icon: "users" }); return; }
  if (t.id === "sf-brand"){ F.stockBrand = t.value; return renderStockList(); }
  if (t.dataset.waParty){ keepFocus(() => { WA[t.dataset.waParty].party = t.value; renderWA(); }); return; }
  if (t.dataset.waItem){ const [k, j] = t.dataset.waItem.split(":"); keepFocus(() => { WA[k].items[j].item = t.value; WA[k].items[j].conf = "edited"; renderWA(); }); return; }
  if (t.id === "wa-file"){ const f = t.files[0]; if (!f) return;
    f.text().then(txt => { const lines = txt.split("\n"); F.waText = lines.slice(-400).join("\n"); $("wa-text").value = F.waText; waRead = true; readWhatsApp(F.waText); }); }
  if (t.id === "td-file"){ if (!t.files.length) return; tdLoadFiles([...t.files]); t.value = ""; }
});
const isTyping = el => el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
document.addEventListener("keydown", e => {
  if ((e.key === "k" || e.key === "K") && (e.ctrlKey || e.metaKey)){ e.preventDefault(); return openSearch(); }
  if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey && !isTyping(e.target) && !dlg.open){ e.preventDefault(); openSearch(); }
});
let rzW = innerWidth, rzT;
addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { if (Math.abs(innerWidth - rzW) > 20){ rzW = innerWidth; drawCharts(); } }, 150); });
function applyTheme(){ const r = document.documentElement; if (theme === "light" || theme === "dark") r.setAttribute("data-theme", theme); else r.removeAttribute("data-theme"); }

// ===================== START =====================
function startApp(){
  document.querySelectorAll("[data-ic]").forEach(el => el.outerHTML = ic(el.dataset.ic));
  load(); tdLoad(); tdLoadSnapshot();
  { const t = lsGet("flow-theme"); if (t === "light" || t === "dark") theme = t; applyTheme(); }
  { const r = lsGet("flow-role"); if (r && ROLES.some(x => x[0] === r)) role = r; }
  { const t = lsGet("flow-tab"); tab = t && TABS.some(x => x[0] === t) ? t : HOME[base()]; }
  renderAll();
}

// ===================== LOCK SCREEN =====================
// A simple gate, not real security: the hash below is checked in this page's own
// JavaScript, so anyone who reads the page's source can see exactly how to bypass it.
// It only keeps a casual visitor with the link from seeing the numbers.
const LOCK_HASH = "599206764eb40f0cbe8680b530410231b73fe76c83a6853526c49f556d14d709";
const LOCK_KEY = "flow-unlocked";
async function sha256Hex(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function showApp(){ $("lock").remove(); const a = $("app-root"); a.style.display = ""; startApp(); }
(function initLock(){
  let unlocked = false; try { unlocked = sessionStorage.getItem(LOCK_KEY) === "1"; } catch(e){}
  if (unlocked) return showApp();
  const form = $("lock-form"), pw = $("lock-pw"), err = $("lock-err");
  pw.focus();
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const ok = (await sha256Hex(pw.value)) === LOCK_HASH;
    if (ok){ try { sessionStorage.setItem(LOCK_KEY, "1"); } catch(ex){} showApp(); }
    else { err.textContent = "Wrong password."; pw.value = ""; pw.focus(); }
  });
})();
</script>
